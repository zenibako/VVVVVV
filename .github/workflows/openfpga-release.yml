name: openfpga release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit stable tag, for example v0.1.0'
        required: true
        type: string
      publish:
        description: 'Publish after reviewing this release candidate'
        required: true
        default: false
        type: boolean
      release_notes:
        description: 'Your release description; required for publication'
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/openfpga-tools.yml
  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: openfpga/tools/go.sum
      - name: Validate requested version
        run: python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["VERSION"]), "Use vX.Y.Z"'
      - name: Build game with the pinned SDK and matched runtime
        run: |
          make -C openfpga deps
          make -C openfpga -j2
          make -C openfpga package
      - name: Build complete preparation tool set
        run: |
          bash openfpga/tools/scripts/install-ci-toolchain.sh "$RUNNER_TEMP/plugin-toolchain"
      - name: Compile native, WASI and Pocket Sync tools
        working-directory: openfpga/tools
        run: make all cli
      - name: Prepare locked official Make and Play files
        run: |
          python3 openfpga/release/makeandplay.py --converter openfpga/tools/build/prepare-data \
            --output openfpga/.deps/makeandplay/prepared
      - name: Build and package the isolated Make and Play edition
        run: |
          make -C openfpga MAKEANDPLAY=1 -j2
          make -C openfpga MAKEANDPLAY=1 package MAKEANDPLAY_ASSETS="$PWD/openfpga/.deps/makeandplay/prepared"
      - name: Build the pinned SDL3 for headless engine checks
        run: |
          git -C openfpga/.deps/sdl3 sparse-checkout disable
          cmake -S openfpga/.deps/sdl3 -B "$RUNNER_TEMP/sdl3-build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3-install" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_X11=OFF -DSDL_WAYLAND=OFF \
            -DSDL_ALSA=OFF -DSDL_PIPEWIRE=OFF -DSDL_PULSEAUDIO=OFF \
            -DSDL_JACK=OFF -DSDL_SNDIO=OFF -DSDL_KMSDRM=OFF
          cmake --build "$RUNNER_TEMP/sdl3-build" --parallel 2
          cmake --install "$RUNNER_TEMP/sdl3-build"
      - name: Verify controller playback of all public Make and Play levels
        run: |
          make -C openfpga MAKEANDPLAY=1 HOST_MAKEANDPLAY_SMOKE=1 host host-render \
            SDL3_PREFIX="$RUNNER_TEMP/sdl3-install" -j2
          mkdir -p "$RUNNER_TEMP/makeandplay-check/saves" "$RUNNER_TEMP/makeandplay-check/captures"
          engine="$PWD/openfpga/build/makeandplay/host-makeandplay-smoke/vvvvvv"
          assets="$PWD/openfpga/.deps/makeandplay/prepared/data.zip"
          cd "$RUNNER_TEMP/makeandplay-check/captures"
          ASAN_OPTIONS=detect_leaks=0 VVV_MAKEANDPLAY_SMOKE_BASEDIR="$RUNNER_TEMP/makeandplay-check/saves/" \
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_DRIVER=software \
            "$engine" -assets "$assets" -basedir "$RUNNER_TEMP/makeandplay-check/saves/"
      - name: Verify the public levels with the Pocket RGB565 renderer
        run: |
          mkdir -p "$RUNNER_TEMP/makeandplay-render-check/saves" "$RUNNER_TEMP/makeandplay-render-check/captures"
          engine="$PWD/openfpga/build/makeandplay/host-makeandplay-smoke/render/vvvvvv"
          assets="$PWD/openfpga/.deps/makeandplay/prepared/data.zip"
          cd "$RUNNER_TEMP/makeandplay-render-check/captures"
          ASAN_OPTIONS=detect_leaks=0 VVV_MAKEANDPLAY_SMOKE_BASEDIR="$RUNNER_TEMP/makeandplay-render-check/saves/" \
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_DRIVER=software \
            "$engine" -assets "$assets" -basedir "$RUNNER_TEMP/makeandplay-render-check/saves/"
      - name: Verify the exact plugin being released
        working-directory: openfpga/tools
        env:
          REQUIRE_PLUGIN_TESTS: '1'
        run: POCKET_PLUGIN_WASM="$PWD/build/plugin.wasm" go test ./integration -v
      - name: Fetch corresponding runtime source
        run: |
          runtime_sha=$(python3 -c 'import json; print(json.load(open("openfpga/release/runtime.lock.json"))["runtime"]["commit"])')
          git init "$RUNNER_TEMP/runtime-source"
          git -C "$RUNNER_TEMP/runtime-source" remote add origin https://github.com/zenibako/openfpgaCore.git
          git -C "$RUNNER_TEMP/runtime-source" fetch --depth 1 origin "$runtime_sha"
          git -C "$RUNNER_TEMP/runtime-source" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/runtime-source" -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive
      - name: Assemble reviewed-source candidate
        run: |
          python3 openfpga/release/assemble.py --sd openfpga/build/sd --tools openfpga/tools/build \
            --makeandplay-sd openfpga/build/makeandplay/sd \
            --output openfpga/build/release --version "$VERSION" --runtime-source "$RUNNER_TEMP/runtime-source"
          (cd openfpga/build/release && sha256sum -c SHA256SUMS)
          python3 -c 'import json; assert json.load(open("openfpga/build/release/PROVENANCE.json"))["publishable"]'
      - uses: actions/upload-artifact@v4
        with:
          name: vvvvvv-openfpga-candidate
          path: openfpga/build/release/*
          if-no-files-found: error
  publish:
    needs: build
    if: inputs.publish
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: vvvvvv-openfpga-candidate
          path: release
      - name: Publish the complete verified set
        run: |
          test -n "$RELEASE_NOTES" || { echo 'Supply your release description before publishing.' >&2; exit 1; }
          test -f release/vvvvvv-openfpga.zip
          test -f release/vvvvvv-makeandplay-openfpga.zip
          (cd release && sha256sum -c SHA256SUMS)
          python3 -c 'import json,os; p=json.load(open("release/PROVENANCE.json")); assert p["publishable"]; assert p["source_commit"] == os.environ["SOURCE_SHA"]; assert p["makeandplay"]["edition"] == "makeandplay"'
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            tag_sha=$(git rev-parse --verify "refs/tags/$VERSION^{commit}")
            test "$tag_sha" = "$SOURCE_SHA" || { echo 'Existing tag does not match the built source; refusing publication.' >&2; exit 1; }
          else
            git tag "$VERSION" "$SOURCE_SHA"
            git push origin "refs/tags/$VERSION"
          fi
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$VERSION" --verify-tag --title "VVVVVV for Analogue Pocket $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" release/*
